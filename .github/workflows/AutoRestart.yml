name: Rustix Auto Restart

on:
  schedule:
    - cron: '37 */2 * * *'
  workflow_dispatch:

jobs:
  run-script:
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    permissions:
      actions: write
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Dependencies, Google Chrome, and Xvfb
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb google-chrome-stable
          pip install --upgrade pip
          pip install playwright requests curl_cffi websockets requests[socks] seleniumbase
          playwright install --with-deps chromium

      - name: Run Rustix automation
        env:
          TG_TOKEN: ${{ secrets.TG_TOKEN }}
          TG_BOT_TOKEN: ${{ secrets.TG_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
          API_KEY: ${{ secrets.API_KEY }}
          RUSTIX_URL: ${{ secrets.RUSTIX_URL }}
          RUSTIX_USERNAME: ${{ secrets.RUSTIX_USERNAME }}
          RUSTIX_PASSWORD: ${{ secrets.RUSTIX_PASSWORD }}
        run: xvfb-run --auto-servernum --server-args="-screen 0 1366x768x24" python rustix.py

      - name: Upload status screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rustix-status-screenshots-${{ github.run_number }}
          if-no-files-found: ignore
          path: |
            *.png
            screenshots/*.png

      - name: Delete old workflow runs
        if: always()
        uses: Mattraks/delete-workflow-runs@v2
        with:
          token: ${{ github.token }}
          repository: ${{ github.repository }}
          retain_days: 0
          keep_minimum_runs: 2
