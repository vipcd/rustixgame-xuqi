name: Rustix Auto Restart

on:
  schedule:
    - cron: '37 */2 * * *'
  workflow_dispatch:

jobs:
  run-script:
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    permissions:
      actions: write
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Dependencies and Microsoft Edge
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb curl gnupg
          
          # 添加 Microsoft 官方 Edge 源并安装
          curl https://packages.microsoft.com/keys/microsoft.asc | gpg --dearmor > microsoft.gpg
          sudo install -o root -g root -m 644 microsoft.gpg /etc/apt/trusted.gpg.d/
          sudo sh -c 'echo "deb [arch=amd64] https://packages.microsoft.com/repos/edge stable main" > /etc/apt/sources.list.d/microsoft-edge.list'
          sudo rm microsoft.gpg
          sudo apt-get update
          sudo apt-get install -y microsoft-edge-stable

          pip install --upgrade pip
          pip install playwright requests curl_cffi websockets requests[socks] seleniumbase
          playwright install --with-deps chromium

      - name: Install and start sing-box
        env:
          NODE_LINK: ${{ secrets.NODE_LINK }}
        run: |
          set -euo pipefail
          test -n "$NODE_LINK" || { echo "❌ NODE_LINK 未配置"; exit 1; }

          curl -fL --retry 3 -o sing-box.tar.gz \
            https://github.com/SagerNet/sing-box/releases/download/v1.9.3/sing-box-1.9.3-linux-amd64.tar.gz
          tar -xzf sing-box.tar.gz
          mv sing-box-*/sing-box ./sing-box
          chmod +x ./sing-box

          python parse_node.py
          
          ./sing-box check -c config.json
          nohup ./sing-box run -c config.json > singbox.log 2>&1 &
          echo $! > singbox.pid
          sleep 8

          if ! kill -0 "$(cat singbox.pid)" 2>/dev/null; then
            echo "❌ sing-box 启动失败"
            cat singbox.log || true
            exit 1
          fi

      - name: Run Rustix automation
        env:
          TG_TOKEN: ${{ secrets.TG_TOKEN }}
          TG_BOT_TOKEN: ${{ secrets.TG_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
          API_KEY: ${{ secrets.API_KEY }}
          RUSTIX_URL: ${{ secrets.RUSTIX_URL }}
          RUSTIX_USERNAME: ${{ secrets.RUSTIX_USERNAME }}
          RUSTIX_PASSWORD: ${{ secrets.RUSTIX_PASSWORD }}
          PROXY_URL: http://127.0.0.1:10809
        run: xvfb-run --auto-servernum --server-args="-screen 0 1366x768x24" python rustix.py

      - name: Upload status screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rustix-status-screenshots-${{ github.run_number }}
          if-no-files-found: ignore
          path: |
            *.png
            screenshots/*.png

      - name: Delete old workflow runs
        if: always()
        uses: Mattraks/delete-workflow-runs@v2
        with:
          token: ${{ github.token }}
          repository: ${{ github.repository }}
          retain_days: 0
          keep_minimum_runs: 2
